# [START gke_ai_ml_gke_slurm_k8s_bridge_kueue_resources]

apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 32Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: slurm-queue
  namespace: slurm
spec:
  clusterQueue: cluster-queue

# [END gke_ai_ml_gke_slurm_k8s_bridge_kueue_resources]