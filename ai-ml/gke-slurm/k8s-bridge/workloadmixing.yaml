# [START gke_ai_ml_gke_slurm_k8s_bridge_workloadmixing]

apiVersion: k8s-bridge.x-k8s.io/v1alpha1
kind: WorkloadMixing
metadata:
  name: default
  namespace: slurm
spec:
  controllerRef:
    name: slurm

  partitionsMapping:
    - partition: k8s-partition
      localQueue: slurm-queue
      dynamicNodeFeature: k8s_dynamic

  podTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: slurmd
          image: gcr.io/gke-release/slinky/slurmd:TAG
          securityContext:
            privileged: true

# [END gke_ai_ml_gke_slurm_k8s_bridge_workloadmixing]