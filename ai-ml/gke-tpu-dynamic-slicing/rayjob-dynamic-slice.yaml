# [START gke_ai_ml_gke_tpu_dynamic_slicing_kuberay_rayjob_dynamic_slice]
apiVersion: ray.io/v1
kind: RayJob
metadata:
  generateName: rayjob-tpu7x-dynamic-slice-
  labels:
    # Target the Kueue LocalQueue
    kueue.x-k8s.io/queue-name: lq
spec:
  # Required by Kueue RayJob validating webhook
  shutdownAfterJobFinishes: true
  entrypoint: |
    python -u -c '
    import os
    import ray

    ray.init()
    print("=== Ray Cluster Initialized ===")
    print("Cluster resources:", ray.cluster_resources())

    @ray.remote(resources={"TPU": 4})
    def check_worker():
        import jax
        jax.distributed.initialize()
        return {
            "hostname": os.getenv("HOSTNAME"),
            "backend": jax.default_backend(),
            "device_count": jax.device_count(),
            "local_device_count": jax.local_device_count(),
            "devices": [str(d) for d in jax.devices()],
        }

    # Dispatch tasks across both worker hosts in the 2x2x2 subslice
    futures = [check_worker.remote() for _ in range(2)]
    results = ray.get(futures)
    print("=== Worker TPU Devices ===")
    for r in results:
        print(r)
    '
  rayClusterSpec:
    rayVersion: '2.60.0'
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray:2.60.0-py312
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: "1"
                memory: 2Gi
    workerGroupSpecs:
    - groupName: tpu-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      numOfHosts: 2
      rayStartParams: {}
      template:
        metadata:
          annotations:
            # Request the specific GKE TPU subslice topology
            cloud.google.com/gke-tpu-slice-topology: 2x2x2
        spec:
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu7x
          tolerations:
          - key: "google.com/tpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          containers:
          - name: ray-worker
            image: rayproject/ray:2.60.0.b7f425-py312-tpu
            resources:
              limits:
                google.com/tpu: 4
              requests:
                google.com/tpu: 4
# [END gke_ai_ml_gke_tpu_dynamic_slicing_kuberay_rayjob_dynamic_slice]
