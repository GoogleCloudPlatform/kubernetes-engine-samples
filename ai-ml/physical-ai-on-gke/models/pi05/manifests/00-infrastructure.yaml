# ---------------------------------------------------------------------------
# Physical AI on GKE - Base Infrastructure
#
# Creates the Kubernetes ServiceAccount (bound to a Google Service Account via
# Workload Identity) and the Cloud Storage FUSE PersistentVolume / Claim that
# every phase of this sample mounts at /checkpoint.
#
# BEFORE APPLYING, replace the two placeholders below:
#   GCS_BUCKET_NAME  -> your Cloud Storage bucket (no gs:// prefix)
#   GSA_EMAIL        -> your Google Service Account email
#
# Example:
#   sed -e "s/GCS_BUCKET_NAME/${BUCKET}/g" -e "s/GSA_EMAIL/${GSA}/g" \
#     models/pi05/manifests/00-infrastructure.yaml | kubectl apply -f -
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-identity-k8s-sa
  namespace: default
  annotations:
    # Google Service Account granted roles/storage.objectAdmin on the bucket.
    iam.gke.io/gcp-service-account: GSA_EMAIL
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: physical-ai-checkpoint-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    # Ignored by the Cloud Storage FUSE CSI driver, but required by the API.
    storage: 64Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - implicit-dirs
    - uid=1000
    - gid=100
  csi:
    driver: gcsfuse.csi.storage.gke.io
    # The Cloud Storage bucket backing /checkpoint.
    volumeHandle: GCS_BUCKET_NAME
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: physical-ai-checkpoint-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 64Gi
  storageClassName: ""
  volumeName: physical-ai-checkpoint-pv
