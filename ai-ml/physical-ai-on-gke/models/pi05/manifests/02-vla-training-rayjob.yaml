# ---------------------------------------------------------------------------
# Phase 2: Distributed VLA fine-tuning (PI0.5, 1000 steps).
#
# Reference node shape: 1 x g4-standard-384
#   8 x NVIDIA RTX PRO 6000 (96 GB VRAM each) | 384 vCPUs | ~1.5 TB host RAM
#
# Worker group below requests the whole node: 8 GPUs / 128 vCPUs / 512 GiB,
# giving one Ray Train DDP worker per GPU (--num-workers 8).
# To run on a smaller node pool, lower num-gpus, nvidia.com/gpu, cpu, memory
# and --num-workers together.
# ---------------------------------------------------------------------------
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: physical-ai-02-vla-finetuning
  namespace: default
  labels:
    app.kubernetes.io/name: physical-ai-vla-finetuning
    app.kubernetes.io/component: model-training
    stage: phase-2-vla-finetuning
spec:
  submissionMode: K8sJobMode
  shutdownAfterJobFinishes: true
  # Release the RayCluster (and therefore all 8 GPUs) as soon as training
  # finishes. A non-zero TTL keeps the GPUs reserved and prevents the Phase 3
  # RayJob from scheduling on a single-node GPU cluster. Submitter pod logs are
  # retained independently of the cluster, so `kubectl logs` still works after.
  ttlSecondsAfterFinished: 0
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: rayproject/ray:2.55.1-py311
  entrypoint: bash -c "bash /app/tools/setup_vla_deps.sh && PYTHONPATH=/app:/app/tools:$PYTHONPATH python3 /app/scripts/02_vla_finetuning.py --dataset-uri /checkpoint/physical-ai/mirror/libero --storage-root /checkpoint/physical-ai --num-workers 8 --max-steps 1000 --round-name round1"
  runtimeEnvYAML: |
    env_vars:
      HF_HUB_OFFLINE: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      TORCHDYNAMO_DISABLE: "1"
      PYTHONPATH: "/app:/app/tools:$PYTHONPATH"
  rayClusterSpec:
    rayVersion: "2.55.1"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "8"
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
            gke-gcsfuse/mount-options: "uid=1000,gid=1000"
          labels:
            ray.io/node-type: head
        spec:
          serviceAccountName: workload-identity-k8s-sa
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          securityContext:
            fsGroup: 100
          containers:
            - name: ray-head
              image: rayproject/ray:2.55.1-py311-gpu
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: "8"
                  memory: "32Gi"
                requests:
                  cpu: "4"
                  memory: "16Gi"
              volumeMounts:
                - name: gcs-fuse-checkpoint-vol
                  mountPath: /checkpoint
                - name: scripts-volume
                  mountPath: /app/scripts
                - name: tools-volume
                  mountPath: /app/tools
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
          volumes:
            - name: gcs-fuse-checkpoint-vol
              persistentVolumeClaim:
                claimName: physical-ai-checkpoint-pvc
            - name: scripts-volume
              configMap:
                name: physical-ai-scripts
            - name: tools-volume
              configMap:
                name: physical-ai-tools
    workerGroupSpecs:
      - groupName: gpu-train-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-gpus: "8"
          num-cpus: "128"
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
              gke-gcsfuse/mount-options: "uid=1000,gid=1000"
            labels:
              ray.io/node-type: worker
          spec:
            serviceAccountName: workload-identity-k8s-sa
            tolerations:
              - key: "nvidia.com/gpu"
                operator: "Exists"
                effect: "NoSchedule"
            securityContext:
              fsGroup: 100
            containers:
              - name: ray-worker
                image: rayproject/ray:2.55.1-py311-gpu
                imagePullPolicy: IfNotPresent
                resources:
                  limits:
                    nvidia.com/gpu: "8"
                    cpu: "128"
                    memory: "512Gi"
                  requests:
                    nvidia.com/gpu: "8"
                    cpu: "64"
                    memory: "256Gi"
                volumeMounts:
                  - name: gcs-fuse-checkpoint-vol
                    mountPath: /checkpoint
                  - name: scripts-volume
                    mountPath: /app/scripts
                  - name: tools-volume
                    mountPath: /app/tools
            volumes:
              - name: gcs-fuse-checkpoint-vol
                persistentVolumeClaim:
                  claimName: physical-ai-checkpoint-pvc
              - name: scripts-volume
                configMap:
                  name: physical-ai-scripts
              - name: tools-volume
                configMap:
                  name: physical-ai-tools
