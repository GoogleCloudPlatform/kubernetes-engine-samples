# ---------------------------------------------------------------------------
# Phase 3b: Persistent 24/7 RayService serving the fine-tuned PI0.5 policy.
#
# Reference node shape: 1 x g4-standard-384
#   8 x NVIDIA RTX PRO 6000 | 384 vCPUs | 1.4 TB host RAM
#
# Serving needs only 1 GPU (8 vCPUs / 32 GiB), leaving the remaining 7 GPUs on
# the node free for other workloads.
# ---------------------------------------------------------------------------
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: physical-ai-vla-serving
  namespace: default
  labels:
    app.kubernetes.io/name: physical-ai-vla-serving
    app.kubernetes.io/component: inference-service
    stage: phase-3-persistent-serving
spec:
  serviceUnhealthySecondThreshold: 300
  deploymentUnhealthySecondThreshold: 300
  serveConfigV2: |
    applications:
      - name: pi05-policy
        route_prefix: /
        import_path: tools.policy_server:app
        runtime_env:
          env_vars:
            LEROBOT_S3_ANON: "1"
            HF_HUB_OFFLINE: "1"
            HF_HUB_ENABLE_HF_TRANSFER: "1"
            HF_HUB_DOWNLOAD_TIMEOUT: "60"
            TORCHDYNAMO_DISABLE: "1"
            PYTHONPATH: "/app:/app/tools:$PYTHONPATH"
            MIRROR_ROOT: "/checkpoint/physical-ai/mirror"
        deployments:
          - name: PI05PolicyServer
            num_replicas: 1
            max_replicas_per_node: 1
            ray_actor_options:
              num_gpus: 1
              num_cpus: 4
            user_config:
              checkpoint_path: "/checkpoint/physical-ai/checkpoint_round1/state.pkl"
              base_model_dir: "/tmp/lerobot/pi05_libero_finetuned"
  rayClusterConfig:
    rayVersion: "2.55.1"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "8"
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
            gke-gcsfuse/mount-options: "uid=1000,gid=1000"
          labels:
            ray.io/node-type: head
        spec:
          serviceAccountName: workload-identity-k8s-sa
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          securityContext:
            fsGroup: 100
          containers:
            - name: ray-head
              image: rayproject/ray:2.55.1-py311-gpu
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: "8"
                  memory: "32Gi"
                requests:
                  cpu: "4"
                  memory: "16Gi"
              volumeMounts:
                - name: gcs-fuse-checkpoint-vol
                  mountPath: /checkpoint
                - name: scripts-volume
                  mountPath: /app/scripts
                - name: tools-volume
                  mountPath: /app/tools
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
          volumes:
            - name: gcs-fuse-checkpoint-vol
              persistentVolumeClaim:
                claimName: physical-ai-checkpoint-pvc
            - name: scripts-volume
              configMap:
                name: physical-ai-scripts
            - name: tools-volume
              configMap:
                name: physical-ai-tools
    workerGroupSpecs:
      - groupName: gpu-serving-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
        rayStartParams:
          num-gpus: "1"
          num-cpus: "8"
        template:
          metadata:
            annotations:
              gke-gcsfuse/volumes: "true"
              gke-gcsfuse/mount-options: "uid=1000,gid=1000"
            labels:
              ray.io/node-type: worker
          spec:
            serviceAccountName: workload-identity-k8s-sa
            tolerations:
              - key: "nvidia.com/gpu"
                operator: "Exists"
                effect: "NoSchedule"
            securityContext:
              fsGroup: 100
            containers:
              - name: ray-worker
                image: rayproject/ray:2.55.1-py311-gpu
                imagePullPolicy: IfNotPresent
                resources:
                  limits:
                    nvidia.com/gpu: "1"
                    cpu: "8"
                    memory: "32Gi"
                  requests:
                    nvidia.com/gpu: "1"
                    cpu: "4"
                    memory: "16Gi"
                volumeMounts:
                  - name: gcs-fuse-checkpoint-vol
                    mountPath: /checkpoint
                  - name: scripts-volume
                    mountPath: /app/scripts
                  - name: tools-volume
                    mountPath: /app/tools
            volumes:
              - name: gcs-fuse-checkpoint-vol
                persistentVolumeClaim:
                  claimName: physical-ai-checkpoint-pvc
              - name: scripts-volume
                configMap:
                  name: physical-ai-scripts
              - name: tools-volume
                configMap:
                  name: physical-ai-tools
